name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ── Build Web ───────────────────────────────────────────────────────────────

  build-web:
    name: Build (Web / ${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('Directory.Packages.props', 'src/MqttProbe.PluginContracts/MqttProbe.PluginContracts.csproj', 'src/MqttProbe.Core/MqttProbe.Core.csproj', 'src/MqttProbe.UI/MqttProbe.UI.csproj', 'global.json') }}
          restore-keys: nuget-

      - name: Extract version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/MqttProbe.Web/MqttProbe.Web.csproj
          -c:Release
          -r:${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          --output publish/web

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish/web
          zip -r ../../mqttprobe-web-${{ matrix.rid }}-${{ github.ref_name }}.zip .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/web/* -DestinationPath mqttprobe-web-${{ matrix.rid }}-${{ github.ref_name }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.rid }}
          path: mqttprobe-web-${{ matrix.rid }}-${{ github.ref_name }}.zip

  # ── Build Docker ────────────────────────────────────────────────────────────

  build-docker:
    name: Build (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            bluegrassiot/mqttprobe
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}

  # ── Build MAUI Windows ──────────────────────────────────────────────────────

  build-maui-windows:
    name: Build (MAUI Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: |
            C:/Program Files/dotnet/packs/
            C:/Program Files/dotnet/metadata/workloads/
          key: maui-windows-workload-${{ hashFiles('global.json') }}

      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          if (-not (dotnet workload list | Select-String 'maui-windows')) {
            dotnet workload install maui-windows --source https://api.nuget.org/v3/index.json
          }

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          IFS='.-' read -r major minor patch _ <<< "$version"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/MqttProbe.Maui/MqttProbe.Maui.csproj
          -f:net10.0-windows10.0.19041.0
          -p:MqttProbeMauiWindowsTargetFrameworksOverride=net10.0-windows10.0.19041.0
          -c:Release
          --output publish/windows
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/windows/* -DestinationPath publish/mqttprobe-windows-${{ github.ref_name }}.zip -Force

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous Velopack release (for delta packages)
        shell: pwsh
        continue-on-error: true   # first Velopack release has nothing to download
        run: vpk download github --repoUrl https://github.com/bluegrassiot/mqttprobe --token ${{ secrets.GITHUB_TOKEN }} --outputDir publish/velopack

      - name: Build installer
        shell: pwsh
        run: >
          vpk pack
          --packId MQTTProbe
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish/windows
          --mainExe MqttProbe.Maui.exe
          --packTitle MQTTProbe
          --packAuthors "Bluegrass IoT"
          --icon src/MqttProbe.Desktop/Assets/icon.ico
          --outputDir publish/velopack

      - name: Remove stale nupkg packages (keep only current version)
        shell: pwsh
        run: >
          Get-ChildItem publish/velopack -Filter *.nupkg |
          Where-Object Name -notlike "MQTTProbe-${{ steps.version.outputs.value }}-*" |
          Remove-Item

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: maui-windows-velopack
          path: publish/velopack/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maui-windows
          path: publish/mqttprobe-windows-${{ github.ref_name }}.zip

  # ── Build MAUI Android ──────────────────────────────────────────────────────

  build-maui-android:
    name: Build (MAUI Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('Directory.Packages.props', 'src/MqttProbe.PluginContracts/MqttProbe.PluginContracts.csproj', 'src/MqttProbe.Core/MqttProbe.Core.csproj', 'src/MqttProbe.UI/MqttProbe.UI.csproj', 'global.json') }}
          restore-keys: nuget-

      - name: Install MAUI Android workload
        run: |
          if ! dotnet workload list | grep -q 'maui-android'; then
            dotnet workload install maui-android --source https://api.nuget.org/v3/index.json
          fi

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # Android versionCode must be a monotonically increasing integer,
          # otherwise devices refuse to install the update over a prior release.
          IFS='.-' read -r major minor patch _ <<< "$version"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mqttprobe.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — APK will be signed with a debug key and users cannot upgrade across releases. See docs/superpowers/RELEASING_ANDROID.md."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (release-signed)
        if: steps.keystore.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish src/MqttProbe.Maui/MqttProbe.Maui.csproj
          -f:net10.0-android
          -c:Release
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ runner.temp }}/mqttprobe.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          --output publish/android

      - name: Publish (debug-signed fallback)
        if: steps.keystore.outputs.available != 'true'
        run: >
          dotnet publish src/MqttProbe.Maui/MqttProbe.Maui.csproj
          -f:net10.0-android
          -c:Release
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          --output publish/android

      - name: Rename APK
        run: |
          apk=$(find publish/android -name '*-Signed.apk' | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find publish/android -name '*.apk' | head -n 1)
          fi
          cp "$apk" "mqttprobe-android-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maui-android
          path: mqttprobe-android-${{ github.ref_name }}.apk

  # ── Build Desktop macOS ─────────────────────────────────────────────────────
  # Photino Desktop (native net10.0) replaces the MAUI Mac Catalyst build, which
  # crashed on launch because Velopack does not support the Catalyst runtime.

  build-macos-desktop:
    name: Build (Desktop macOS)
    uses: ./.github/workflows/build-macos-desktop.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  # ── Build Desktop Linux ────────────────────────────────────────────────────

  build-desktop-linux:
    name: Build (Desktop Linux)
    uses: ./.github/workflows/build-linux-desktop.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}

  # ── Create GitHub Release ───────────────────────────────────────────────────

  create-release:
    name: Create Release
    needs: [build-web, build-docker, build-desktop-linux, build-maui-windows, build-macos-desktop, build-maui-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: git-cliff diffs the previous tag against this one
      # to build the changelog, and a shallow clone would leave it empty. No
      # submodules, because only commit messages are read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download web-linux-x64
        uses: actions/download-artifact@v8
        with:
          name: web-linux-x64

      - name: Download web-linux-arm64
        uses: actions/download-artifact@v8
        with:
          name: web-linux-arm64

      - name: Download web-win-x64
        uses: actions/download-artifact@v8
        with:
          name: web-win-x64

      - name: Download maui-windows
        uses: actions/download-artifact@v8
        with:
          name: maui-windows

      - name: Download maui-windows-velopack
        uses: actions/download-artifact@v8
        with:
          name: maui-windows-velopack
          path: velopack

      - name: Download desktop-macos-velopack
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-velopack
          path: velopack-osx

      - name: Download maui-android
        uses: actions/download-artifact@v8
        with:
          name: maui-android

      - name: Download desktop-linux-x64
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64

      - name: Download desktop-linux-velopack
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-velopack
          path: velopack-linux

      - name: Download desktop-linux-third-party-sources
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-third-party-sources

      - name: Fail on duplicate release asset names
        run: |
          DUPES=$(find velopack* -type f -printf '%f\n' 2>/dev/null | sort | uniq -d)
          if [ -n "$DUPES" ]; then echo "::error::Duplicate asset filenames across Velopack channels:"; echo "$DUPES"; exit 1; fi

      # Everything below is derived from .github/, not typed into this file, so the
      # release page cannot drift away from what actually ships.
      - name: Resolve release assets
        id: assets
        # shell: bash adds -eo pipefail, so a failing resolve is not hidden by tee.
        shell: bash
        run: |
          python3 scripts/ci/release-notes.py resolve \
            --manifest .github/release-assets.txt \
            --version "${{ github.ref_name }}" \
            --root . | tee release-assets.resolved.txt
          {
            echo 'list<<RELEASE_ASSETS'
            cat release-assets.resolved.txt
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        run: |
          python3 scripts/ci/release-notes.py render \
            --notes .github/release-notes.md \
            --version "${{ github.ref_name }}" \
            --out release-notes.md

      - name: Find previous tag
        id: prevtag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          echo "value=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .git-cliff.toml
          args: --output changelog.md "${{ steps.prevtag.outputs.value }}..${{ github.ref_name }}"

      - name: Assemble release body
        env:
          PREV_TAG: ${{ steps.prevtag.outputs.value }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat release-notes.md
            echo
            echo
            cat changelog.md
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV_TAG...$TAG"
            fi
          } > release-body.md

      # Fails the release when an uploaded artifact is undocumented, or a downloads
      # table row names something that was never shipped.
      - name: Check release notes cover the shipped assets
        run: |
          python3 scripts/ci/release-notes.py check \
            --manifest .github/release-assets.txt \
            --notes release-body.md \
            --version "${{ github.ref_name }}" \
            --root .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: ${{ steps.assets.outputs.list }}
