# Pinned so the project name and volumes survive a clone into a differently
# named folder. Matches the name Compose already derives from this directory.
name: mqttprobe

services:
  mqttprobe:
    image: bluegrassiot/mqttprobe:latest
    ports:
      - "8080:8080"
    volumes:
      - mqttprobe-config:/app/config
      # Optional: drop payload format plugin DLLs here (e.g. CustomDemoPlugin/CustomDemoPlugin.dll).
      # Restart the container after adding or updating plugins.
      - mqttprobe-plugins:/app/Plugins
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Host filtering answers "Bad Request - Invalid Hostname" (400) to any Host
      # header not listed here, so reaching this container by LAN IP or hostname
      # needs that name added. Set MQTTPROBE_HOST in a .env file next to this
      # compose file, e.g. MQTTPROBE_HOST=192.168.1.50, then recreate the container.
      AllowedHosts: "${MQTTPROBE_HOST:-localhost};localhost;127.0.0.1;[::1]"
    networks:
      - mqttprobe-net
    restart: unless-stopped

  # Optional: remove this section if you have an existing MQTT broker to connect to.
  # WARNING: allow_anonymous true is for local evaluation only.
  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint:
      - /bin/sh
      - /mosquitto/bootstrap.sh
    volumes:
      - ./deploy/mosquitto/bootstrap.sh:/mosquitto/bootstrap.sh:ro
    ports:
      - "1883:1883"   # Plain MQTT
      - "8883:8883"   # MQTT over TLS (MQTTS)
      - "9001:9001"   # MQTT over WebSocket
      - "9002:9002"   # MQTT over WebSocket + TLS (WSS)
    networks:
      - mqttprobe-net
    restart: unless-stopped

volumes:
  mqttprobe-config:
  mqttprobe-plugins:

networks:
  mqttprobe-net:
