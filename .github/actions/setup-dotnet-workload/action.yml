name: Setup .NET workload
description: Set up the global.json SDK and install a pinned workload set
inputs:
  workload:
    description: Workload ID to install
    required: true
  workload-version:
    description: Workload set version to install
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Verify selected SDK matches global.json
      shell: pwsh
      run: |
        $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
        if (-not $expected) {
          Write-Host "::error::global.json does not contain an sdk.version pin"
          exit 1
        }
        $selected = (dotnet --version)
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $selected = $selected.Trim()
        if ($selected -ne $expected) {
          Write-Host "::error::Selected .NET SDK $selected does not match global.json pin $expected"
          exit 1
        }
    - name: Install .NET workload
      shell: pwsh
      env:
        WORKLOAD_ID: ${{ inputs.workload }}
        WORKLOAD_VERSION: ${{ inputs.workload-version }}
      run: |
        $started = [System.Diagnostics.Stopwatch]::StartNew()
        dotnet workload install "$env:WORKLOAD_ID" --version "$env:WORKLOAD_VERSION" --source https://api.nuget.org/v3/index.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Workload install elapsed: $($started.Elapsed)"
