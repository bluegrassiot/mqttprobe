name: Setup .NET SDK
description: Select the global.json SDK, verify its pins, and restore or install workloads
inputs:
  workload:
    description: Workload ID to install; leave empty to only restore the pinned workload set
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Verify selected SDK matches global.json
      shell: pwsh
      run: |
        $sdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk
        if (-not $sdk.version) {
          Write-Host "::error::global.json does not contain an sdk.version pin"
          exit 1
        }
        if ($sdk.workloadVersion -isnot [string] -or $sdk.workloadVersion -notmatch '^\d+\.\d+\.\d+$') {
          Write-Host "::error::global.json does not contain a valid sdk.workloadVersion pin"
          exit 1
        }
        $selected = (dotnet --version)
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $selected = $selected.Trim()
        if ($selected -ne $sdk.version) {
          Write-Host "::error::Selected .NET SDK $selected does not match global.json pin $($sdk.version)"
          exit 1
        }
    - name: Restore pinned .NET workload set
      if: inputs.workload == ''
      shell: pwsh
      run: |
        $started = [System.Diagnostics.Stopwatch]::StartNew()
        dotnet workload update --source https://api.nuget.org/v3/index.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Workload set restore elapsed: $($started.Elapsed)"
    - name: Install .NET workload
      if: inputs.workload != ''
      shell: pwsh
      env:
        WORKLOAD_ID: ${{ inputs.workload }}
      run: |
        $started = [System.Diagnostics.Stopwatch]::StartNew()
        dotnet workload install "$env:WORKLOAD_ID" --source https://api.nuget.org/v3/index.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Workload install elapsed: $($started.Elapsed)"
