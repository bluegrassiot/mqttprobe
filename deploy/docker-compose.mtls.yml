# Full stack for client certificate (mTLS) lab testing.
# Prerequisites:
#   python scripts/dev/generate-mtls-certs.py
# Then:
#   docker compose -f deploy/docker-compose.mtls.yml up -d --build
#
# --build compiles the app from the working tree, which is the point of this
# lab: it exists to exercise unreleased mTLS and certificate handling.
#
# Import deploy/mtls/certs/client.pfx (password changeme) in MQTTProbe.
# Connect to 127.0.0.1:8883 with Use TLS and Allow untrusted certificate.

# Pinned because the prod variant lives in this same directory and would otherwise
# default to the same project name and fight over these volumes and the network.
name: mqttprobe-mtls

services:
  mqttprobe:
    image: bluegrassiot/mqttprobe:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - mqttprobe-config:/app/config
      - mqttprobe-plugins:/app/Plugins
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - mqttprobe-net
    restart: unless-stopped

  # mTLS Mosquitto: TLS listeners require a client certificate signed by the lab CA.
  # Plain 1883/9001 remain anonymous for comparison. Lab only — do not expose publicly.
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mtls/certs:/certs:ro
      - ./mtls/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"   # Plain MQTT (no client cert)
      - "8883:8883"   # MQTTS + require client cert
      - "9001:9001"   # WebSocket (no client cert)
      - "9002:9002"   # WSS + require client cert
    networks:
      - mqttprobe-net
    restart: unless-stopped

volumes:
  mqttprobe-config:
  mqttprobe-plugins:

networks:
  mqttprobe-net:
